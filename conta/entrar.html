<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar na sua conta | Marques</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../logo-mark-128.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="../styles.css">
</head>
<body>

<div class="noise-overlay" aria-hidden="true"></div>

<!-- ===================== HEADER ===================== -->
<header class="site-header">
  <div class="container header-inner">
    <a href="../loja.html" class="logo" aria-label="Marques - Início">
      <img src="../logo-mark-128.png" alt="Marques" class="logo-mark-img">
      <span class="logo-text">Marques</span>
    </a>
    <nav class="main-nav" id="mainNav">
      <a href="../index.html" class="nav-link">Crédito Solar</a>
      <a href="../loja.html#catalogo" class="nav-link">Catálogo</a>
    </nav>
    <div class="header-actions">
      <button class="hamburger" id="hamburgerBtn" aria-label="Abrir menu">
        <svg class="icon" id="hamburgerIcon" viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
    </div>
  </div>
</header>

<!-- ===================== CONTEÚDO ===================== -->
<main class="account-page account-narrow">
  <div class="hero-mesh" aria-hidden="true"></div>
  <div class="container">
    <div class="account-card">
      <h1>Entrar na sua conta</h1>
      <p class="account-sub">Acompanhe seus pedidos da loja e suas solicitações de crédito num só lugar.</p>

      <div class="account-error" id="loginError"></div>

      <form id="loginForm">
        <div class="form-grid">
          <label class="col-span-2">E-mail
            <input type="email" id="email" name="email" required autocomplete="username" placeholder="voce@email.com">
          </label>
          <label class="col-span-2">Senha
            <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••">
          </label>
        </div>
        <div style="margin-top: 22px;">
          <button type="submit" class="btn btn-primary" id="loginBtn" style="width:100%; justify-content:center;">Entrar</button>
        </div>
      </form>

      <p class="account-footer-link">Ainda não tem conta? <a href="cadastro.html" id="switchToCadastroLink">Cadastre-se</a></p>
    </div>

    <!-- ---- PASSO 2FA: aparece só se a conta tiver verificação em duas etapas ativa ---- -->
    <div class="account-card" id="twoFaCard" hidden>
      <h1>Verificação em duas etapas</h1>
      <p class="account-sub">Digite o código de 6 dígitos do seu app autenticador, ou um dos seus códigos de backup.</p>

      <div class="account-error" id="twoFaError"></div>

      <form id="twoFaForm">
        <div class="form-grid">
          <label class="col-span-2">Código
            <input type="text" id="twoFaCode" name="code" required autocomplete="one-time-code" inputmode="numeric" placeholder="000000" maxlength="9">
          </label>
        </div>
        <div style="margin-top: 22px; display:flex; flex-direction:column; gap:10px;">
          <button type="submit" class="btn btn-primary" id="twoFaBtn" style="width:100%; justify-content:center;">Confirmar</button>
          <button type="button" class="btn btn-ghost" id="twoFaBackBtn" style="width:100%; justify-content:center;">Voltar</button>
        </div>
      </form>
    </div>
  </div>
</main>

<script src="../api-config.js"></script>
<script src="conta.js"></script>
<script>
// Pra onde ir depois de autenticar: ?redirect=loja.html%23checkout leva de
// volta pro checkout/simulação que a pessoa estava fazendo; sem isso, cai
// na tela de Minha Conta.
function getRedirectTarget(){
  const raw = new URLSearchParams(location.search).get("redirect");
  return raw ? `../${raw}` : "minha-conta.html";
}

(async function () {
  // Se já existir sessão válida, pula direto pro destino.
  const me = await CONTA.apiGet("/api/customers/me").catch(() => null);
  if (me && me.ok) window.location.href = getRedirectTarget();
})();

// Preserva o ?redirect= ao trocar pra tela de cadastro.
(function () {
  const redirect = new URLSearchParams(location.search).get("redirect");
  if (redirect) {
    document.getElementById("switchToCadastroLink").href = "cadastro.html?redirect=" + encodeURIComponent(redirect);
  }
})();

let pendingTwoFaToken = null;

document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const errorBox = document.getElementById("loginError");
  const btn = document.getElementById("loginBtn");
  errorBox.classList.remove("show");
  btn.disabled = true;
  btn.textContent = "Entrando...";

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  try {
    const res = await CONTA.apiPost("/api/customers/login", { email, password });
    if (!res.ok) {
      errorBox.textContent = res.error || "Não foi possível entrar.";
      errorBox.classList.add("show");
      return;
    }
    if (res.requires2FA) {
      pendingTwoFaToken = res.pendingToken;
      document.getElementById("loginForm").closest(".account-card").hidden = true;
      document.getElementById("twoFaCard").hidden = false;
      document.getElementById("twoFaCode").focus();
      return;
    }
    window.location.href = getRedirectTarget();
  } catch (err) {
    errorBox.textContent = "Erro de conexão com o servidor. Tente novamente em instantes.";
    errorBox.classList.add("show");
  } finally {
    btn.disabled = false;
    btn.textContent = "Entrar";
  }
});

document.getElementById("twoFaForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const errorBox = document.getElementById("twoFaError");
  const btn = document.getElementById("twoFaBtn");
  errorBox.classList.remove("show");
  btn.disabled = true;
  btn.textContent = "Confirmando...";

  const code = document.getElementById("twoFaCode").value.trim();

  try {
    const res = await CONTA.apiPost("/api/customers/login/2fa", { pendingToken: pendingTwoFaToken, code });
    if (!res.ok) {
      if (res.pendingToken) pendingTwoFaToken = res.pendingToken;
      errorBox.textContent = res.error || "Não foi possível confirmar o código.";
      errorBox.classList.add("show");
      if (res.expired) {
        document.getElementById("twoFaCard").hidden = true;
        document.getElementById("loginForm").closest(".account-card").hidden = false;
      }
      return;
    }
    window.location.href = getRedirectTarget();
  } catch (err) {
    errorBox.textContent = "Erro de conexão com o servidor. Tente novamente em instantes.";
    errorBox.classList.add("show");
  } finally {
    btn.disabled = false;
    btn.textContent = "Confirmar";
  }
});

document.getElementById("twoFaBackBtn").addEventListener("click", () => {
  pendingTwoFaToken = null;
  document.getElementById("twoFaCard").hidden = true;
  document.getElementById("loginForm").closest(".account-card").hidden = false;
  document.getElementById("twoFaForm").reset();
});
</script>
</body>
</html>
