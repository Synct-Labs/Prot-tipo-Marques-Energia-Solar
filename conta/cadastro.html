<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Criar conta | Marques</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../logo-mark-128.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="../styles.css">
</head>
<body>

<div class="noise-overlay" aria-hidden="true"></div>

<!-- ===================== HEADER ===================== -->
<header class="site-header">
  <div class="container header-inner">
    <a href="../loja.html" class="logo" aria-label="Marques - Início">
      <img src="../logo-mark-128.png" alt="Marques" class="logo-mark-img">
      <span class="logo-text">Marques</span>
    </a>
    <nav class="main-nav" id="mainNav">
      <a href="../index.html" class="nav-link">Crédito Solar</a>
      <a href="../loja.html#catalogo" class="nav-link">Catálogo</a>
    </nav>
    <div class="header-actions">
      <button class="hamburger" id="hamburgerBtn" aria-label="Abrir menu">
        <svg class="icon" id="hamburgerIcon" viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
    </div>
  </div>
</header>

<!-- ===================== CONTEÚDO ===================== -->
<main class="account-page account-narrow">
  <div class="container">
    <div class="account-card">
      <h1>Criar sua conta</h1>
      <p class="account-sub">Uma conta só para acompanhar tudo: pedidos da loja Marques Energia Solar e solicitações de crédito da Marques Promotora.</p>

      <div class="account-error" id="cadastroError"></div>

      <form id="cadastroForm">
        <div class="form-grid">
          <label class="col-span-2">Nome completo
            <input type="text" id="nome" name="nome" required autocomplete="name" placeholder="Seu nome completo">
          </label>
          <label class="col-span-2">E-mail
            <input type="email" id="email" name="email" required autocomplete="username" placeholder="voce@email.com">
          </label>
          <label>CPF <span class="field-hint">(opcional)</span>
            <input type="text" id="cpf" name="cpf" autocomplete="off" placeholder="000.000.000-00">
          </label>
          <label>Telefone <span class="field-hint">(opcional)</span>
            <input type="tel" id="telefone" name="telefone" autocomplete="tel" placeholder="(00) 00000-0000">
          </label>
          <label class="col-span-2">Senha
            <input type="password" id="password" name="password" required autocomplete="new-password" placeholder="Mínimo de 8 caracteres">
          </label>
          <label class="col-span-2">Confirmar senha
            <input type="password" id="passwordConfirm" name="passwordConfirm" required autocomplete="new-password" placeholder="Repita a senha">
          </label>
        </div>

        <label class="account-consent">
          <input type="checkbox" id="consent" required>
          <span>Li e concordo com a <a href="../termos.html" target="_blank" rel="noopener">Política de Privacidade e Termos de Uso</a> da Marques Energia Solar e da <a href="../termos-credito.html" target="_blank" rel="noopener">Marques Promotora</a>.</span>
        </label>

        <div style="margin-top: 6px;">
          <button type="submit" class="btn btn-primary" id="cadastroBtn" style="width:100%; justify-content:center;">Criar conta</button>
        </div>
      </form>

      <p class="account-footer-link">Já tem conta? <a href="entrar.html">Entrar</a></p>
    </div>
  </div>
</main>

<script src="../api-config.js"></script>
<script src="conta.js"></script>
<script>
(async function () {
  const me = await CONTA.apiGet("/api/customers/me").catch(() => null);
  if (me && me.ok) window.location.href = "minha-conta.html";
})();

document.getElementById("cadastroForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const errorBox = document.getElementById("cadastroError");
  const btn = document.getElementById("cadastroBtn");
  errorBox.classList.remove("show");

  const nome = document.getElementById("nome").value.trim();
  const email = document.getElementById("email").value.trim();
  const cpf = document.getElementById("cpf").value.trim();
  const telefone = document.getElementById("telefone").value.trim();
  const password = document.getElementById("password").value;
  const passwordConfirm = document.getElementById("passwordConfirm").value;
  const consent = document.getElementById("consent").checked;

  if (password !== passwordConfirm) {
    errorBox.textContent = "As senhas não coincidem.";
    errorBox.classList.add("show");
    return;
  }
  if (!consent) {
    errorBox.textContent = "É preciso concordar com os termos para continuar.";
    errorBox.classList.add("show");
    return;
  }

  btn.disabled = true;
  btn.textContent = "Criando conta...";

  try {
    const res = await CONTA.apiPost("/api/customers/register", { nome, email, cpf, telefone, password });
    if (!res.ok) {
      errorBox.textContent = res.error || "Não foi possível criar sua conta.";
      errorBox.classList.add("show");
      return;
    }
    window.location.href = "minha-conta.html";
  } catch (err) {
    errorBox.textContent = "Erro de conexão com o servidor. Tente novamente em instantes.";
    errorBox.classList.add("show");
  } finally {
    btn.disabled = false;
    btn.textContent = "Criar conta";
  }
});
</script>
</body>
</html>
