<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Pedidos | Painel de Administrador | Marques Energia Solar</title>
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="admin.css">
</head>
<body class="admin-body">

<header class="admin-topbar">
  <div class="admin-brand">
    <img src="../logo-mark-128.png" alt="Marques Energia Solar">
    <span>Painel de Administrador</span>
  </div>
  <nav class="admin-nav">
    <a href="dashboard.html" class="admin-nav-link active">Pedidos</a>
    <a href="credit-leads.html" class="admin-nav-link">Solicitações de Crédito</a>
    <a href="marques-pay.html" class="admin-nav-link">Marques Pay</a>
    <a href="catalogo.html" class="admin-nav-link">Catálogo</a>
    <a href="parceiros.html" class="admin-nav-link">Parceiros</a>
    <a href="compra-programada.html" class="admin-nav-link">Compra Programada</a>
    <a href="equipe.html" class="admin-nav-link">Equipe</a>
    <a href="notificacoes.html" class="admin-nav-link">Notificações</a>
  </nav>
  <div class="admin-topbar-right">
    <span class="admin-user" id="adminUserLabel"></span>
    <button class="admin-btn admin-btn-ghost" id="logoutBtn">Sair</button>
  </div>
</header>

<main class="admin-main">
  <div class="admin-container">

    <div class="admin-stats-grid" id="statsGrid"></div>

    <div class="admin-toolbar">
      <h2 style="font-size:1.15rem;">Pedidos</h2>
      <div class="admin-toolbar-filters">
        <input type="text" id="searchInput" placeholder="Buscar por nome, e-mail ou nº do pedido">
        <select id="statusFilter">
          <option value="">Todos os status</option>
        </select>
        <button class="admin-btn admin-btn-ghost" id="refreshBtn">Atualizar</button>
      </div>
    </div>

    <div class="admin-table-wrap">
      <table class="admin-table">
        <thead>
          <tr>
            <th>Pedido</th>
            <th>Cliente</th>
            <th>Cidade/UF</th>
            <th>Itens</th>
            <th>Total</th>
            <th>Status</th>
            <th>Data</th>
          </tr>
        </thead>
        <tbody id="ordersTableBody">
          <tr><td colspan="7" class="admin-loading">Carregando pedidos...</td></tr>
        </tbody>
      </table>
    </div>

  </div>
</main>

<script src="../api-config.js"></script>
<script src="admin.js"></script>
<script>
const API_BASE = window.MES_API_BASE || "";
let allOrders = [];

function fileToBase64(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result).split(",")[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function statOptionsHTML(){
  return MES.STATUS_ORDER.map(s => `<option value="${s}">${MES.STATUS_LABELS[s]}</option>`).join("");
}

function renderStats(stats){
  const grid = document.getElementById("statsGrid");
  const total = Object.values(stats).reduce((a,b) => a+b, 0);
  const cards = [["Total", total]].concat(
    MES.STATUS_ORDER.map(s => [MES.STATUS_LABELS[s], stats[s] || 0])
  );
  grid.innerHTML = cards.map(([label, value]) => `
    <div class="admin-stat-card">
      <div class="admin-stat-value">${value}</div>
      <div class="admin-stat-label">${label}</div>
    </div>`).join("");
}

function orderDetailHTML(order){
  const itemsHTML = order.itens.map(it => `
    <div class="admin-detail-item-row">
      <span>${it.qty}x ${it.nome}</span>
      <span>${MES.formatBRL(it.preco * it.qty)}</span>
    </div>`).join("");

  const end = order.endereco;
  const enderecoLinha = `${end.rua || ""}, ${end.numero || ""}${end.complemento ? ", " + end.complemento : ""}`;

  return `
    <div class="admin-detail-block">
      <h4>Cliente</h4>
      <p>${order.customer.nome}</p>
      <p>${order.customer.cpf}</p>
      <p>${order.customer.email}</p>
      <p>${order.customer.telefone}</p>
    </div>
    <div class="admin-detail-block">
      <h4>Endereço de entrega</h4>
      <p>${enderecoLinha}</p>
      <p>${end.bairro || ""}</p>
      <p>${end.cidade || ""} / ${end.estado || ""}</p>
      <p>CEP ${end.cep || ""}</p>
    </div>
    <div class="admin-detail-block">
      <h4>Pagamento</h4>
      <p>${order.pagamento ? order.pagamento.toUpperCase() : "-"}${order.parcelas > 1 ? ` em ${order.parcelas}x sem juros` : ""}</p>
      <h4 style="margin-top:14px;">Itens do pedido</h4>
      <div class="admin-detail-items">${itemsHTML}</div>
    </div>
    <div class="admin-detail-block">
      <h4>Documentos do cliente</h4>
      <p>${order.temDocEndereco ? `<a class="admin-btn admin-btn-ghost" href="${API_BASE}/api/admin/orders/${order.id}/doc-endereco" target="_blank" rel="noopener">Comprovante de endereço</a>` : `<span class="admin-muted">Sem comprovante de endereço</span>`}</p>
      <p style="margin-top:8px;">${order.temDocFoto ? `<a class="admin-btn admin-btn-ghost" href="${API_BASE}/api/admin/orders/${order.id}/doc-foto" target="_blank" rel="noopener">Documento com foto</a>` : `<span class="admin-muted">Sem documento com foto</span>`}</p>
    </div>
    <div class="admin-detail-block">
      <h4>Contrato</h4>
      ${order.temContrato ? `<p><a class="admin-btn admin-btn-ghost" href="${API_BASE}/api/admin/orders/${order.id}/contrato" target="_blank" rel="noopener">Baixar contrato</a></p>` : `<p class="admin-muted">Nenhum contrato anexado ainda.</p>`}
      <form class="admin-contrato-form" data-order-id="${order.id}" style="display:flex; gap:8px; align-items:center; margin-top:8px;">
        <input type="file" accept="image/*,application/pdf" required>
        <button type="submit" class="admin-btn admin-btn-ghost" style="width:auto;">${order.temContrato ? "Substituir" : "Anexar"} contrato</button>
      </form>
    </div>
    <div class="admin-detail-block">
      <h4>Link de pagamento ${order.pagamento === "boleto" ? "(boleto)" : ""}</h4>
      <p class="admin-note" style="margin:0 0 8px; text-align:left;">${order.partnerId ? "Enviado por e-mail pro parceiro que indicou/assistiu o pedido." : "Enviado por e-mail direto pro cliente."}</p>
      ${order.paymentLink ? `<p class="admin-muted" style="word-break:break-all;">Último enviado: ${order.paymentLink}</p>` : `<p class="admin-muted">Nenhum link enviado ainda.</p>`}
      <form class="admin-payment-link-form" data-order-id="${order.id}" style="display:flex; gap:8px; align-items:center; margin-top:8px; flex-wrap:wrap;">
        <input type="text" name="link" placeholder="${order.pagamento === "boleto" ? "Link ou linha digitável do boleto" : "Link de pagamento"}" style="flex:1; min-width:220px;" required>
        <button type="submit" class="admin-btn admin-btn-ghost" style="width:auto;">Enviar</button>
      </form>
    </div>
    <div class="admin-detail-block">
      <h4>Pendência</h4>
      ${order.pendencia ? `
        <p class="admin-error show">${order.pendencia.texto}</p>
        <p class="admin-muted" style="margin-top:-4px;">Lançada em ${MES.formatDate(order.pendencia.criadaEm)} por ${order.pendencia.autor}</p>
        <button type="button" class="admin-btn admin-btn-ghost admin-resolve-pendencia-btn" data-order-id="${order.id}" style="margin-top:8px;">Marcar como resolvida</button>
      ` : `
        <p class="admin-muted">Nenhuma pendência aberta.</p>
        <form class="admin-pendencia-form" data-order-id="${order.id}" style="display:flex; gap:8px; align-items:flex-start; margin-top:8px; flex-wrap:wrap;">
          <textarea name="texto" placeholder="Ex: comprovante de endereço ilegível, pedir outro." style="flex:1; min-width:220px; min-height:56px; background:var(--surface-2); color:var(--white); border:1px solid var(--border); border-radius:var(--radius-sm); padding:8px 10px;" required></textarea>
          <button type="submit" class="admin-btn admin-btn-ghost" style="width:auto;">Lançar pendência</button>
        </form>
      `}
    </div>
  `;
}

function renderOrders(list){
  const tbody = document.getElementById("ordersTableBody");
  if(list.length === 0){
    tbody.innerHTML = `<tr><td colspan="7" class="admin-empty">Nenhum pedido encontrado.</td></tr>`;
    return;
  }

  tbody.innerHTML = list.map(order => {
    const itemsCount = order.itens.reduce((sum,i) => sum + i.qty, 0);
    return `
    <tr class="admin-order-row" data-id="${order.id}">
      <td data-label="Pedido">${order.orderNumber}</td>
      <td data-label="Cliente">${order.customer.nome}</td>
      <td data-label="Cidade/UF">${order.endereco.cidade || "-"} / ${order.endereco.estado || "-"}</td>
      <td data-label="Itens">${itemsCount}</td>
      <td data-label="Total">${MES.formatBRL(order.total)}</td>
      <td data-label="Status">${MES.statusSelectHTML(order.status, order.id)}</td>
      <td data-label="Data">${MES.formatDate(order.createdAt)}</td>
    </tr>
    <tr class="admin-order-detail" data-detail-for="${order.id}">
      <td colspan="7"><div class="admin-order-detail-inner">${orderDetailHTML(order)}</div></td>
    </tr>`;
  }).join("");
}

function applyFilters(){
  const q = document.getElementById("searchInput").value.trim().toLowerCase();
  const status = document.getElementById("statusFilter").value;
  let list = allOrders;
  if(status) list = list.filter(o => o.status === status);
  if(q){
    list = list.filter(o =>
      o.orderNumber.toLowerCase().includes(q) ||
      o.customer.nome.toLowerCase().includes(q) ||
      o.customer.email.toLowerCase().includes(q)
    );
  }
  renderOrders(list);
}

async function loadStats(){
  const res = await MES.apiGet("/api/admin/stats");
  if(res.ok) renderStats(res.stats);
}

async function loadOrders(){
  document.getElementById("ordersTableBody").innerHTML =
    `<tr><td colspan="7" class="admin-loading">Carregando pedidos...</td></tr>`;
  const res = await MES.apiGet("/api/admin/orders");
  if(!res.ok){
    MES.showToast(res.error || "Erro ao carregar pedidos.");
    return;
  }
  allOrders = res.orders;
  applyFilters();
}

async function init(){
  const admin = await MES.requireAuth("energia_solar");
  if(!admin) return;
  document.getElementById("statusFilter").insertAdjacentHTML("beforeend", statOptionsHTML());

  await Promise.all([loadStats(), loadOrders()]);
}

document.getElementById("logoutBtn").addEventListener("click", () => MES.logout());
document.getElementById("refreshBtn").addEventListener("click", () => { loadStats(); loadOrders(); });
document.getElementById("searchInput").addEventListener("input", applyFilters);
document.getElementById("statusFilter").addEventListener("change", applyFilters);

document.getElementById("ordersTableBody").addEventListener("submit", async (e) => {
  const form = e.target.closest(".admin-contrato-form");
  if(!form) return;
  e.preventDefault();
  const file = form.querySelector('input[type="file"]').files[0];
  if(!file) return;
  if(file.size > 8 * 1024 * 1024){ MES.showToast("Contrato muito grande (máximo 8MB)."); return; }
  const btn = form.querySelector("button[type=submit]");
  btn.disabled = true; btn.textContent = "Enviando...";
  try{
    const res = await MES.apiPost(`/api/admin/orders/${form.dataset.orderId}/contrato`, {
      contratoBase64: await fileToBase64(file), contratoTipo: file.type, contratoNome: file.name,
    });
    if(!res.ok){ MES.showToast(res.error || "Erro ao anexar contrato."); return; }
    MES.showToast("Contrato anexado.");
    const idx = allOrders.findIndex(o => String(o.id) === form.dataset.orderId);
    if(idx > -1) allOrders[idx] = res.order;
    document.querySelector(`[data-detail-for="${form.dataset.orderId}"] .admin-order-detail-inner`).innerHTML = orderDetailHTML(res.order);
  } finally {
    btn.disabled = false; btn.textContent = "Anexar contrato";
  }
});

document.getElementById("ordersTableBody").addEventListener("click", (e) => {
  // clique numa linha (fora do <select>) abre/fecha o detalhe
  if(e.target.closest("select")) return;
  const row = e.target.closest(".admin-order-row");
  if(!row) return;
  const id = row.dataset.id;
  const detail = document.querySelector(`.admin-order-detail[data-detail-for="${id}"] .admin-order-detail-inner`);
  if(detail) detail.classList.toggle("open");
});

function updateOrderDetail(order){
  const idx = allOrders.findIndex(o => String(o.id) === String(order.id));
  if(idx > -1) allOrders[idx] = order;
  const detail = document.querySelector(`[data-detail-for="${order.id}"] .admin-order-detail-inner`);
  if(detail){ detail.innerHTML = orderDetailHTML(order); detail.classList.add("open"); }
}

document.getElementById("ordersTableBody").addEventListener("submit", async (e) => {
  const linkForm = e.target.closest(".admin-payment-link-form");
  const pendenciaForm = e.target.closest(".admin-pendencia-form");
  if(!linkForm && !pendenciaForm) return;
  e.preventDefault();

  if(linkForm){
    const link = linkForm.querySelector('[name="link"]').value.trim();
    if(!link) return;
    const btn = linkForm.querySelector("button[type=submit]");
    btn.disabled = true; btn.textContent = "Enviando...";
    try{
      const res = await MES.apiPost(`/api/admin/orders/${linkForm.dataset.orderId}/payment-link`, { link });
      if(!res.ok){ MES.showToast(res.error || "Erro ao enviar link."); return; }
      MES.showToast("Link enviado por e-mail.");
      updateOrderDetail(res.order);
    } finally {
      btn.disabled = false; btn.textContent = "Enviar";
    }
    return;
  }

  const texto = pendenciaForm.querySelector('[name="texto"]').value.trim();
  if(!texto) return;
  const btn = pendenciaForm.querySelector("button[type=submit]");
  btn.disabled = true; btn.textContent = "Lançando...";
  try{
    const res = await MES.apiPost(`/api/admin/orders/${pendenciaForm.dataset.orderId}/pendencia`, { texto });
    if(!res.ok){ MES.showToast(res.error || "Erro ao lançar pendência."); return; }
    MES.showToast("Pendência lançada e e-mail enviado.");
    updateOrderDetail(res.order);
  } finally {
    btn.disabled = false; btn.textContent = "Lançar pendência";
  }
});

document.getElementById("ordersTableBody").addEventListener("click", async (e) => {
  const btn = e.target.closest(".admin-resolve-pendencia-btn");
  if(!btn) return;
  btn.disabled = true; btn.textContent = "Marcando...";
  try{
    const res = await MES.apiPost(`/api/admin/orders/${btn.dataset.orderId}/pendencia/resolver`, {});
    if(!res.ok){ MES.showToast(res.error || "Erro ao marcar pendência como resolvida."); return; }
    MES.showToast("Pendência marcada como resolvida.");
    updateOrderDetail(res.order);
  } finally {
    btn.disabled = false; btn.textContent = "Marcar como resolvida";
  }
});

document.getElementById("ordersTableBody").addEventListener("change", async (e) => {
  const select = e.target.closest(".admin-status-select");
  if(!select) return;
  const id = select.dataset.orderId;
  const newStatus = select.value;
  const res = await MES.apiPatch(`/api/admin/orders/${id}`, { status: newStatus });
  if(!res.ok){
    MES.showToast(res.error || "Erro ao atualizar status.");
    return;
  }
  MES.showToast("Status do pedido atualizado.");
  const idx = allOrders.findIndex(o => String(o.id) === String(id));
  if(idx > -1) allOrders[idx] = res.order;
  loadStats();
});

init();
</script>
</body>
</html>
