<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Solicitações de Crédito | Painel de Administrador | Marques Energia Solar</title>
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="admin.css">
<script src="../theme-toggle.js"></script>
<script src="../i18n-dict.js"></script>
<script src="../i18n.js"></script>
</head>
<body class="admin-body">

<header class="admin-topbar">
  <div class="admin-brand">
    <img src="../logo-mark-128.png" alt="Marques Energia Solar">
    <span>Painel de Administrador</span>
  </div>
  <nav class="admin-nav">
    <a href="dashboard.html" class="admin-nav-link">Pedidos</a>
    <a href="credit-leads.html" class="admin-nav-link active">Solicitações de Crédito</a>
    <a href="marques-pay.html" class="admin-nav-link">Marques Pay</a>
    <a href="catalogo.html" class="admin-nav-link">Catálogo</a>
    <a href="parceiros.html" class="admin-nav-link">Parceiros</a>
    <a href="compra-programada.html" class="admin-nav-link">Compra Programada</a>
    <a href="equipe.html" class="admin-nav-link">Equipe</a>
    <a href="notificacoes.html" class="admin-nav-link">Notificações</a>
  </nav>
  <div class="admin-topbar-right">
    <span class="admin-user" id="adminUserLabel"></span>
    <button class="admin-btn admin-btn-ghost" id="logoutBtn">Sair</button>
  </div>
</header>

<main class="admin-main">
  <div class="admin-container">

    <div class="admin-stats-grid" id="statsGrid"></div>

    <div class="admin-toolbar">
      <h2 style="font-size:1.15rem;">Solicitações de Análise de Crédito</h2>
      <div class="admin-toolbar-filters">
        <input type="text" id="searchInput" placeholder="Buscar por nome, e-mail, CPF ou nº da solicitação">
        <select id="statusFilter">
          <option value="">Todos os status</option>
        </select>
        <button class="admin-btn admin-btn-ghost" id="refreshBtn">Atualizar</button>
      </div>
    </div>

    <div class="admin-table-wrap">
      <table class="admin-table">
        <thead>
          <tr>
            <th>Solicitação</th>
            <th>Nome</th>
            <th>Modalidade</th>
            <th>Cidade/UF</th>
            <th>Renda líquida</th>
            <th>Status</th>
            <th>Data</th>
          </tr>
        </thead>
        <tbody id="leadsTableBody">
          <tr><td colspan="7" class="admin-loading">Carregando solicitações...</td></tr>
        </tbody>
      </table>
    </div>

  </div>
</main>

<script src="../api-config.js"></script>
<script src="admin.js"></script>
<script>
const API_BASE = window.MES_API_BASE || "";
let allLeads = [];
function t(text){ return window.MES_I18N ? window.MES_I18N.t(text) : text; }

function fileToBase64(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result).split(",")[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

const MODALIDADE_LABELS = {
  clt: t("Crédito CLT"),
  fgts: t("Saque FGTS"),
  consorcio: t("Compra Programada"),
  financiamento: t("Financiamento Solar"),
};

const TIPO_VINCULO_LABELS = {
  clt: "CLT",
  autonomo: t("Autônomo"),
  empresario: t("Empresário"),
  servidor_publico: t("Servidor público"),
  outro: t("Outro"),
};

const ESTADO_CIVIL_LABELS = {
  solteiro: t("Solteiro(a)"),
  casado: t("Casado(a)"),
  uniao_estavel: t("União estável"),
  divorciado: t("Divorciado(a)"),
  viuvo: t("Viúvo(a)"),
};

function statOptionsHTML(){
  return MES.LEAD_STATUS_ORDER.map(s => `<option value="${s}">${MES.LEAD_STATUS_LABELS[s]}</option>`).join("");
}

function renderStats(stats){
  const grid = document.getElementById("statsGrid");
  const total = Object.values(stats).reduce((a,b) => a+b, 0);
  const cards = [[t("Total"), total]].concat(
    MES.LEAD_STATUS_ORDER.map(s => [MES.LEAD_STATUS_LABELS[s], stats[s] || 0])
  );
  grid.innerHTML = cards.map(([label, value]) => `
    <div class="admin-stat-card">
      <div class="admin-stat-value">${value}</div>
      <div class="admin-stat-label">${label}</div>
    </div>`).join("");
}

function leadDetailHTML(lead){
  const db = lead.dadosBasicos;
  const dp = lead.dadosProfissionais;
  const nascimento = db.dataNascimento ? new Date(db.dataNascimento + "T00:00:00").toLocaleDateString("pt-BR") : "-";

  return `
    <div class="admin-detail-block">
      <h4>${t("Dados básicos")}</h4>
      <p>${db.nome}</p>
      <p>${t("CPF:")} ${db.cpf}</p>
      <p>${t("Nascimento:")} ${nascimento}</p>
      <p>${t("Estado civil:")} ${ESTADO_CIVIL_LABELS[db.estadoCivil] || t("Não informado")}</p>
      <p>${db.telefone}</p>
      <p>${db.email}</p>
      <p>${db.cidadeUf}</p>
    </div>
    <div class="admin-detail-block">
      <h4>${t("Dados profissionais")}</h4>
      <p>${dp.profissao}</p>
      <p>${t("Vínculo:")} ${TIPO_VINCULO_LABELS[dp.tipoVinculo] || dp.tipoVinculo}</p>
      <p>${dp.empresa}</p>
      <p>${t("Tempo de trabalho:")} ${dp.tempoTrabalho}</p>
      <p>${t("Renda bruta:")} ${MES.formatBRL(dp.rendaBruta)}</p>
      <p>${t("Renda líquida:")} ${MES.formatBRL(dp.rendaLiquida)}</p>
    </div>
    ${enderecoDetailHTML(lead)}
    <div class="admin-detail-block">
      <h4>${t("Simulação feita pelo cliente")}</h4>
      ${simulacaoDetailHTML(lead)}
    </div>
    <div class="admin-detail-block">
      <h4>${t("Contrato")}</h4>
      ${lead.temContrato ? `<p><a class="admin-btn admin-btn-ghost" href="${API_BASE}/api/admin/credit-leads/${lead.id}/contrato" target="_blank" rel="noopener">${t("Baixar contrato")}</a></p>` : `<p class="admin-muted">${t("Nenhum contrato anexado ainda.")}</p>`}
      <form class="admin-contrato-form" data-lead-id="${lead.id}" style="display:flex; gap:8px; align-items:center; margin-top:8px;">
        <input type="file" accept="image/*,application/pdf" required>
        <button type="submit" class="admin-btn admin-btn-ghost" style="width:auto;">${lead.temContrato ? t("Substituir") : t("Anexar")} ${t("contrato")}</button>
      </form>
    </div>
  `;
}

// Só CLT e Financiamento Solar pedem endereço no formulário — nas outras
// modalidades o objeto vem vazio.
function enderecoDetailHTML(lead){
  const end = lead.endereco || {};
  if(!end.cep && !end.rua) return "";
  return `
    <div class="admin-detail-block">
      <h4>${t("Endereço")}</h4>
      <p>${end.rua}, ${end.numero}${end.complemento ? " - " + end.complemento : ""}</p>
      <p>${end.bairro}</p>
      <p>${end.cidade} / ${end.estado}</p>
      <p>${t("CEP")} ${end.cep}</p>
    </div>`;
}

function simulacaoDetailHTML(lead){
  const sim = lead.simulacao || {};
  const modalidade = MODALIDADE_LABELS[lead.modalidadeInteresse] || lead.modalidadeInteresse || t("Não informada");
  if(sim.valorSistema == null){
    return `<p>${t("Modalidade:")} ${modalidade}</p><p class="admin-muted">${t("Formulário enviado sem passar pela simulação.")}</p>`;
  }
  const linhas = [`<p>${t("Modalidade:")} ${modalidade}</p>`, `<p>${t("Valor do sistema:")} ${MES.formatBRL(sim.valorSistema)}</p>`];
  if(sim.parcelas != null) linhas.push(`<p>${t("Parcelas:")} ${sim.parcelas}x</p>`);
  if(sim.fgtsDisponivel != null) linhas.push(`<p>${t("FGTS disponível informado:")} ${MES.formatBRL(sim.fgtsDisponivel)}</p>`);
  if(sim.parcelaEstimada != null) linhas.push(`<p>${t("Parcela estimada:")} <strong>${MES.formatBRL(sim.parcelaEstimada)}${t("/mês")}</strong></p>`);
  return linhas.join("");
}

function renderLeads(list){
  const tbody = document.getElementById("leadsTableBody");
  if(list.length === 0){
    tbody.innerHTML = `<tr><td colspan="7" class="admin-empty">${t("Nenhuma solicitação encontrada.")}</td></tr>`;
    return;
  }

  tbody.innerHTML = list.map(lead => {
    const db = lead.dadosBasicos;
    const dp = lead.dadosProfissionais;
    return `
    <tr class="admin-order-row" data-id="${lead.id}">
      <td data-label="Solicitação">${lead.leadNumber}</td>
      <td data-label="Nome">${db.nome}</td>
      <td data-label="Modalidade">${MODALIDADE_LABELS[lead.modalidadeInteresse] || "-"}</td>
      <td data-label="Cidade/UF">${db.cidadeUf || "-"}</td>
      <td data-label="Renda líquida">${MES.formatBRL(dp.rendaLiquida)}</td>
      <td data-label="Status">${MES.leadStatusSelectHTML(lead.status, lead.id)}</td>
      <td data-label="Data">${MES.formatDate(lead.createdAt)}</td>
    </tr>
    <tr class="admin-order-detail" data-detail-for="${lead.id}">
      <td colspan="7"><div class="admin-order-detail-inner">${leadDetailHTML(lead)}</div></td>
    </tr>`;
  }).join("");
}

function applyFilters(){
  const q = document.getElementById("searchInput").value.trim().toLowerCase();
  const status = document.getElementById("statusFilter").value;
  let list = allLeads;
  if(status) list = list.filter(l => l.status === status);
  if(q){
    list = list.filter(l =>
      l.leadNumber.toLowerCase().includes(q) ||
      l.dadosBasicos.nome.toLowerCase().includes(q) ||
      l.dadosBasicos.email.toLowerCase().includes(q) ||
      l.dadosBasicos.cpf.toLowerCase().includes(q)
    );
  }
  renderLeads(list);
}

async function loadStats(){
  const res = await MES.apiGet("/api/admin/credit-leads/stats");
  if(res.ok) renderStats(res.stats);
}

async function loadLeads(){
  document.getElementById("leadsTableBody").innerHTML =
    `<tr><td colspan="7" class="admin-loading">${t("Carregando solicitações...")}</td></tr>`;
  const res = await MES.apiGet("/api/admin/credit-leads");
  if(!res.ok){
    MES.showToast(res.error || t("Erro ao carregar solicitações."));
    return;
  }
  allLeads = res.leads;
  applyFilters();
}

async function init(){
  const admin = await MES.requireAuth("promotora");
  if(!admin) return;
  document.getElementById("statusFilter").insertAdjacentHTML("beforeend", statOptionsHTML());

  await Promise.all([loadStats(), loadLeads()]);
}

document.getElementById("logoutBtn").addEventListener("click", () => MES.logout());
document.getElementById("refreshBtn").addEventListener("click", () => { loadStats(); loadLeads(); });
document.getElementById("searchInput").addEventListener("input", applyFilters);
document.getElementById("statusFilter").addEventListener("change", applyFilters);

document.getElementById("leadsTableBody").addEventListener("submit", async (e) => {
  const form = e.target.closest(".admin-contrato-form");
  if(!form) return;
  e.preventDefault();
  const file = form.querySelector('input[type="file"]').files[0];
  if(!file) return;
  if(file.size > 8 * 1024 * 1024){ MES.showToast(t("Contrato muito grande (máximo 8MB).")); return; }
  const btn = form.querySelector("button[type=submit]");
  btn.disabled = true; btn.textContent = t("Enviando...");
  try{
    const res = await MES.apiPost(`/api/admin/credit-leads/${form.dataset.leadId}/contrato`, {
      contratoBase64: await fileToBase64(file), contratoTipo: file.type, contratoNome: file.name,
    });
    if(!res.ok){ MES.showToast(res.error || t("Erro ao anexar contrato.")); return; }
    MES.showToast(t("Contrato anexado."));
    const idx = allLeads.findIndex(l => String(l.id) === form.dataset.leadId);
    if(idx > -1) allLeads[idx] = res.lead;
    document.querySelector(`[data-detail-for="${form.dataset.leadId}"] .admin-order-detail-inner`).innerHTML = leadDetailHTML(res.lead);
  } finally {
    btn.disabled = false; btn.textContent = `${t("Anexar")} ${t("contrato")}`;
  }
});

document.getElementById("leadsTableBody").addEventListener("click", (e) => {
  // clique numa linha (fora do <select>) abre/fecha o detalhe
  if(e.target.closest("select")) return;
  const row = e.target.closest(".admin-order-row");
  if(!row) return;
  const id = row.dataset.id;
  const detail = document.querySelector(`.admin-order-detail[data-detail-for="${id}"] .admin-order-detail-inner`);
  if(detail) detail.classList.toggle("open");
});

document.getElementById("leadsTableBody").addEventListener("change", async (e) => {
  const select = e.target.closest(".admin-status-select");
  if(!select) return;
  const id = select.dataset.leadId;
  const newStatus = select.value;
  const res = await MES.apiPatch(`/api/admin/credit-leads/${id}`, { status: newStatus });
  if(!res.ok){
    MES.showToast(res.error || t("Erro ao atualizar status."));
    return;
  }
  MES.showToast(t("Status da solicitação atualizado."));
  const idx = allLeads.findIndex(l => String(l.id) === String(id));
  if(idx > -1) allLeads[idx] = res.lead;
  loadStats();
});

init();
</script>
</body>
</html>
