  baterias: [["tensao",t("Tensão")],["capacidade",t("Capacidade")],["tecnologia",t("Tecnologia")],["ciclos",t("Vida útil")],["dimensoes",t("Dimensões")],["peso",t("Peso")],["garantia",t("Garantia")]],
  controlador: [["tipo",t("Tipo de carregamento")],["corrente",t("Corrente nominal")],["tensaoSistema",t("Tensão do sistema")],["eficiencia",t("Eficiência")],["protecoes",t("Proteções")],["dimensoes",t("Dimensões")],["garantia",t("Garantia")]],

const CATEGORY_FACETS = {

};

function esc(v){ return String(v == null ? "" : v).replace(/"/g, "&quot;"); }
// Imagens do catálogo são salvas com caminho relativo à raiz do site (ex:
// "assets/products/x.jpg"), mas esta página vive em /admin — precisa subir
// um nível pra resolver certo. URLs completas (http...) passam direto.
function resolveImageUrl(src){
  if(!src) return "";
  if(/^https?:\/\//i.test(src)) return src;
  // Foto enviada pelo admin: é uma rota da API, não um arquivo do site.
  if(src.startsWith("/api/")) return `${window.MES_API_BASE || ""}${src}`;
  return `../${src}`;
}

/* ---------------------- UPLOAD DE IMAGENS (até 5 por produto) ---------------------- */
const MAX_PRODUCT_IMAGES = 5;
const UPLOAD_MAX_SIDE = 1600;
const UPLOAD_KEEP_ORIGINAL_BELOW = 1.5 * 1024 * 1024;

function blobToBase64(blob){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result).split(",")[1]);
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}

// Foto de celular/câmera costuma ter vários MB — reduz pra no máx. 1600px
// antes de enviar (PNG/WEBP viram WEBP, que mantém fundo transparente).
async function prepareImage(file){
  if(!["image/jpeg","image/png","image/webp"].includes(file.type)){
    throw new Error(t("Use imagem JPG, PNG ou WEBP."));
  }
  const bitmap = await createImageBitmap(file);
  const scale = Math.min(1, UPLOAD_MAX_SIDE / Math.max(bitmap.width, bitmap.height));
  if(scale === 1 && file.size <= UPLOAD_KEEP_ORIGINAL_BELOW){
    return { base64: await blobToBase64(file), mime: file.type, nome: file.name };
  }
  const canvas = document.createElement("canvas");
  canvas.width = Math.round(bitmap.width * scale);
  canvas.height = Math.round(bitmap.height * scale);
  canvas.getContext("2d").drawImage(bitmap, 0, 0, canvas.width, canvas.height);
  const outMime = file.type === "image/jpeg" ? "image/jpeg" : "image/webp";
  const blob = await new Promise(resolve => canvas.toBlob(resolve, outMime, 0.88));
  return { base64: await blobToBase64(blob), mime: blob.type, nome: file.name };
}

async function uploadProductImage(file){
  const img = await prepareImage(file);
  const res = await MES.apiPost("/api/admin/product-images", { imageBase64: img.base64, imageTipo: img.mime, imageNome: img.nome });
  if(!res.ok) throw new Error(res.error || t("Não foi possível enviar a imagem."));
  return res.url;
}

function attrJSON(v){
  return JSON.stringify(v).replace(/&/g, "&amp;").replace(/"/g, "&quot;");
}

/* Galeria do produto: só mostra as imagens que existem + um botão de
   adicionar enquanto houver vaga — os espaços vazios ficam ocultos. */
function galleryBlockHTML(images){
  return `
    <div class="col-span-2 pf-gallery-block">
      <h4 class="admin-form-section-title">${t("Imagens do produto")}</h4>
      <div class="pf-gallery" data-images="${attrJSON(images)}"></div>
      <div class="admin-error pf-gallery-error"></div>
      <input type="file" class="pf-gallery-file" accept="image/jpeg,image/png,image/webp" multiple hidden>
    </div>`;
}

function renderGallery(gallery){
  const list = gallery._images;
  gallery.innerHTML = list.map((src, i) => `
      <div class="pf-gallery-item">
        <img src="${resolveImageUrl(src)}" alt="">
        ${i === 0 ? `<span class="pf-gallery-main">${t("Principal")}</span>` : ""}
        <button type="button" class="pf-gallery-remove" data-idx="${i}" title="${t("Excluir imagem")}">✕</button>
      </div>`).join("") +
    (list.length < MAX_PRODUCT_IMAGES
      ? `<button type="button" class="pf-gallery-add"><span>+ ${t("Adicionar imagem")}</span><small>${list.length}/${MAX_PRODUCT_IMAGES}</small></button>`
      : "");
}

function wireGallery(root){
  const gallery = root.querySelector(".pf-gallery");
  if(!gallery) return;
  const fileInput = root.querySelector(".pf-gallery-file");
  const errorBox = root.querySelector(".pf-gallery-error");
  gallery._images = JSON.parse(gallery.dataset.images || "[]");
  renderGallery(gallery);

  gallery.addEventListener("click", (e) => {
    const remove = e.target.closest(".pf-gallery-remove");
    if(remove){
      gallery._images.splice(Number(remove.dataset.idx), 1);
      errorBox.classList.remove("show");
      renderGallery(gallery);
      return;
    }
    if(e.target.closest(".pf-gallery-add")) fileInput.click();
  });

  fileInput.addEventListener("change", async () => {
    const files = Array.from(fileInput.files);
    fileInput.value = "";
    errorBox.classList.remove("show");
    const room = MAX_PRODUCT_IMAGES - gallery._images.length;
    const addBtn = gallery.querySelector(".pf-gallery-add");
    if(addBtn){ addBtn.disabled = true; addBtn.querySelector("span").textContent = t("Enviando..."); }
    try{
      for(const file of files.slice(0, room)){
        gallery._images.push(await uploadProductImage(file));
        renderGallery(gallery);
      }
      if(files.length > room){
        errorBox.textContent = t("Limite de 5 imagens por produto — as que passaram do limite foram ignoradas.");
        errorBox.classList.add("show");
      }
    } catch(err){
      errorBox.textContent = err.message;
      errorBox.classList.add("show");
    } finally {
      renderGallery(gallery);
    }
  });
}

/* Foto de cada item do kit (1 por item): botão de enviar + miniatura. */
function bundlePhotoHTML(image){
  return `
    <div class="bi-photo">
      <input type="hidden" class="bi-image" value="${esc(image)}">
      ${image ? `<img class="bi-thumb" src="${resolveImageUrl(image)}" alt="">` : ""}
      <button type="button" class="admin-btn admin-btn-ghost bi-upload-btn">${image ? t("Trocar foto") : t("Enviar foto")}</button>
      ${image ? `<button type="button" class="admin-btn admin-btn-ghost bi-clear-btn" title="${t("Excluir imagem")}">✕</button>` : ""}
      <input type="file" class="bi-file" accept="image/jpeg,image/png,image/webp" hidden>
    </div>`;
}

function categoryOptionsHTML(selected){
  return Object.entries(CATEGORY_LABELS).map(([k,l]) =>
    `<option value="${k}" ${k === selected ? "selected" : ""}>${l}</option>`).join("");
}
function facetOptionsHTML(cat, selected){
  const opts = CATEGORY_FACETS[cat] || [];
  return `<option value="">—</option>` + opts.map(v =>
    `<option value="${v}" ${v === selected ? "selected" : ""}>${t(v)}</option>`).join("");
}
function specFieldsHTML(cat, specs = {}){
  const fields = CATEGORY_SPEC_FIELDS[cat] || [];
  return fields.map(([key,label]) => `
    <label class="admin-field">${label}
      <input type="text" class="pf-spec-input" data-key="${key}" value="${esc(specs[key])}">
    </label>`).join("");
}
function bundleItemRowHTML(it = {}){
  return `<div class="admin-bundle-item-row">
    <input type="text" class="bi-brand" placeholder="${t("Marca")}" value="${esc(it.brand)}">
    <input type="text" class="bi-name" placeholder="${t("Nome do item")}" value="${esc(it.name)}">
    <input type="text" class="bi-sku" placeholder="SKU" value="${esc(it.sku)}">
    <input type="number" class="bi-qty" placeholder="${t("Qtd")}" min="1" value="${it.qty || 1}">
    ${bundlePhotoHTML(it.image)}
    <button type="button" class="admin-btn admin-btn-ghost remove-bundle-item-btn" title="${t("Remover item")}">✕</button>
  </div>`;
}

function productFormHTML(p = {}){
  const cat = p.cat || "kits";
  const isKit = cat === "kits";
  return `
    <label class="admin-field">${t("Categoria")}
      <select class="pf-cat">${categoryOptionsHTML(cat)}</select>
    </label>
    <label class="admin-field">${t("Nome do produto")}
      <input type="text" class="pf-name" value="${esc(p.name)}" required>
    </label>
    <label class="admin-field">${t("Marca")}
      <input type="text" class="pf-brand" value="${esc(p.brand)}">
    </label>
    <label class="admin-field">SKU
      <input type="text" class="pf-sku" value="${esc(p.sku)}">
    </label>
    <label class="admin-field">${t("Preço (R$)")}
      <input type="number" class="pf-price" min="0.01" step="0.01" value="${p.price ?? ""}" required>
    </label>
    <label class="admin-field">${t("Preço promocional (opcional)")}
      <input type="number" class="pf-promo-price" min="0.01" step="0.01" value="${p.promoPrice ?? ""}">
    </label>
    <label class="admin-field">${t("Rótulo da promoção")}
      <input type="text" class="pf-promo-label" value="${esc(p.promoLabel)}" placeholder="${t("Ex: Oferta de lançamento")}">
    </label>
    <label class="admin-field">${t("Embalagem de venda")}
      <input type="text" class="pf-emb" value="${esc(p.embVenda)}" placeholder="${t("Ex: 1 unidade")}">
    </label>
    <label class="admin-field">${t("Subcategoria")}
      <input type="text" class="pf-subcat" value="${esc(p.subcategoria)}">
    </label>
    <label class="admin-field">${t("Faixa do filtro (facet)")}
      <select class="pf-facet">${facetOptionsHTML(cat, p.facetValue)}</select>
    </label>
    ${galleryBlockHTML(p.images || (p.image ? [p.image] : []))}
    <label class="admin-checkbox-row col-span-2">
      <input type="checkbox" class="pf-launch" ${p.isLaunch ? "checked" : ""}> ${t('Marcar como "Lançamento"')}
    </label>

    <div class="col-span-2">
      <h4 class="admin-form-section-title">${t("Especificações")}</h4>
      <div class="admin-product-form-grid" id="pfSpecsGrid">${specFieldsHTML(cat, p.specs)}</div>
    </div>

    <div class="col-span-2 admin-kit-block" id="pfKitBlock" ${isKit ? "" : 'style="display:none;"'}>
      <h4 class="admin-form-section-title">${t("Itens do kit (painéis, inversor...)")}</h4>
      <div id="pfBundleItems">${(p.bundleItems || []).map(bundleItemRowHTML).join("")}</div>
      <button type="button" class="admin-btn admin-btn-ghost" id="pfAddBundleItemBtn" style="width:auto; margin-top:8px;">${t("+ Item do kit")}</button>
    </div>
  `;
}

function wireProductForm(root){
  const catSelect = root.querySelector(".pf-cat");
  catSelect.addEventListener("change", () => {
    const cat = catSelect.value;
    root.querySelector("#pfSpecsGrid").innerHTML = specFieldsHTML(cat, {});
    root.querySelector(".pf-facet").innerHTML = facetOptionsHTML(cat, "");
    root.querySelector("#pfKitBlock").style.display = cat === "kits" ? "" : "none";
  });
  root.querySelector("#pfAddBundleItemBtn")?.addEventListener("click", () => {
    root.querySelector("#pfBundleItems").insertAdjacentHTML("beforeend", bundleItemRowHTML());
  });
  root.querySelector("#pfBundleItems")?.addEventListener("click", (e) => {
    const btn = e.target.closest(".remove-bundle-item-btn");
    if(btn) { btn.closest(".admin-bundle-item-row").remove(); return; }

    const row = e.target.closest(".admin-bundle-item-row");
    if(!row) return;
    if(e.target.closest(".bi-upload-btn")) row.querySelector(".bi-file").click();
    if(e.target.closest(".bi-clear-btn")) row.querySelector(".bi-photo").outerHTML = bundlePhotoHTML("");
  });
  root.querySelector("#pfBundleItems")?.addEventListener("change", async (e) => {
    const fileInput = e.target.closest(".bi-file");
    if(!fileInput || !fileInput.files[0]) return;
    const file = fileInput.files[0];
    const photo = fileInput.closest(".bi-photo");
    const uploadBtn = photo.querySelector(".bi-upload-btn");
    uploadBtn.disabled = true; uploadBtn.textContent = t("Enviando...");
    try{
      photo.outerHTML = bundlePhotoHTML(await uploadProductImage(file));
    } catch(err){
      uploadBtn.disabled = false; uploadBtn.textContent = t("Enviar foto");
      MES.showToast(err.message);
    }
  });
  wireGallery(root);
}

function readProductForm(root){
  const specs = {};
  root.querySelectorAll(".pf-spec-input").forEach(inp => {
    if(inp.value.trim()) specs[inp.dataset.key] = inp.value.trim();
  });
  const cat = root.querySelector(".pf-cat").value;
  const bundleItems = cat === "kits"
    ? Array.from(root.querySelectorAll("#pfBundleItems .admin-bundle-item-row")).map(row => ({
        brand: row.querySelector(".bi-brand").value.trim(),
        name: row.querySelector(".bi-name").value.trim(),
        sku: row.querySelector(".bi-sku").value.trim(),
        qty: Number(row.querySelector(".bi-qty").value) || 1,
        image: row.querySelector(".bi-image").value.trim(),
      })).filter(it => it.name)
    : [];
  const promoPriceRaw = root.querySelector(".pf-promo-price").value;

  return {
    cat,
    name: root.querySelector(".pf-name").value.trim(),
    brand: root.querySelector(".pf-brand").value.trim(),
    sku: root.querySelector(".pf-sku").value.trim(),
    price: Number(root.querySelector(".pf-price").value),
    promoPrice: promoPriceRaw ? Number(promoPriceRaw) : null,
    promoLabel: root.querySelector(".pf-promo-label").value.trim(),
    embVenda: root.querySelector(".pf-emb").value.trim(),
    subcategoria: root.querySelector(".pf-subcat").value.trim(),
    facetValue: root.querySelector(".pf-facet").value,
    images: root.querySelector(".pf-gallery")._images.slice(),
    isLaunch: root.querySelector(".pf-launch").checked,
    specs,
    bundleItems,
  };
}

/* ---------------------- NOVO PRODUTO ---------------------- */
const newProductFieldsBox = document.getElementById("newProductFields");
newProductFieldsBox.innerHTML = productFormHTML({});
wireProductForm(document.getElementById("newProductForm"));

document.getElementById("newProductBtn").addEventListener("click", () => {
  document.getElementById("newProductCard").style.display = "block";
});
document.getElementById("cancelNewProductBtn").addEventListener("click", () => {
  document.getElementById("newProductCard").style.display = "none";
  newProductFieldsBox.innerHTML = productFormHTML({});
  wireProductForm(document.getElementById("newProductForm"));
});

document.getElementById("newProductForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const errorBox = document.getElementById("newProductError");
  const btn = document.getElementById("newProductSubmitBtn");
  errorBox.classList.remove("show");
  btn.disabled = true; btn.textContent = t("Criando...");
  try{
    const payload = readProductForm(document.getElementById("newProductForm"));
    const res = await MES.apiPost("/api/admin/products", payload);
    if(!res.ok){
      errorBox.textContent = res.error || t("Não foi possível criar o produto.");
      errorBox.classList.add("show");
      return;
    }
    document.getElementById("newProductCard").style.display = "none";
    newProductFieldsBox.innerHTML = productFormHTML({});
    wireProductForm(document.getElementById("newProductForm"));
    MES.showToast(t("Produto criado."));
    loadProducts();
  } finally {
    btn.disabled = false; btn.textContent = t("Criar produto");
  }
});

  return `
    <div class="admin-detail-block" style="grid-column: 1 / -1;">
      <div class="admin-product-form-grid">${productFormHTML(p)}</div>
      <div class="admin-error" data-edit-error="${p.id}"></div>
      <div style="display:flex; gap:10px; margin-top:16px;">
        <button type="button" class="admin-btn save-product-btn" style="width:auto;" data-id="${p.id}">${t("Salvar alterações")}</button>
        <button type="button" class="admin-btn admin-btn-ghost delete-product-btn" style="width:auto;" data-id="${p.id}">${t("Excluir produto")}</button>
      </div>
    </div>`;
}

function priceCellHTML(p){
  if(p.promoPrice){
    return `<span style="text-decoration:line-through; color:var(--muted); font-size:.78rem; display:block;">${MES.formatBRL(p.price)}</span>
            <span style="color:var(--danger); font-weight:700;">${MES.formatBRL(p.promoPrice)}</span>`;
  }
  return MES.formatBRL(p.price);
}

function renderProducts(list){
  const tbody = document.getElementById("productsTableBody");
  if(list.length === 0){
    tbody.innerHTML = `<tr><td colspan="6" class="admin-empty">${t("Nenhum produto encontrado.")}</td></tr>`;
    return;
  }
  tbody.innerHTML = list.map(p => `
    <tr class="admin-order-row" data-id="${p.id}">
      <td data-label="" style="width:44px;">${p.image ? `<img src="${resolveImageUrl(p.image)}" alt="" style="width:36px;height:36px;object-fit:contain;border-radius:6px;background:#fff;">` : ""}</td>
      <td data-label="Produto">${p.name}${p.isLaunch ? ` <span class="status-badge status-novo">${t("Lançamento")}</span>` : ""}${p.promoPrice ? ` <span class="status-badge status-cancelado">${p.promoLabel || t("Promoção")}</span>` : ""}</td>
      <td data-label="Categoria">${CATEGORY_LABELS[p.cat] || p.cat}</td>
      <td data-label="Marca">${p.brand || "-"}</td>
      <td data-label="Preço">${priceCellHTML(p)}</td>
      <td data-label=""><span class="admin-note">SKU ${p.sku || "-"}</span></td>
    </tr>
    <tr class="admin-order-detail" data-detail-for="${p.id}">
      <td colspan="6"><div class="admin-order-detail-inner" id="productDetailInner-${p.id}"></div></td>
    </tr>`).join("");
}

function applyFilters(){
  const q = document.getElementById("searchInput").value.trim().toLowerCase();
  const cat = document.getElementById("catFilter").value;
  let list = allProducts;
  if(cat) list = list.filter(p => p.cat === cat);
  if(q){
    list = list.filter(p =>
      p.name.toLowerCase().includes(q) ||
      (p.brand || "").toLowerCase().includes(q) ||
      (p.sku || "").toLowerCase().includes(q)
    );
  }
  renderProducts(list);
}

async function loadProducts(){
  document.getElementById("productsTableBody").innerHTML = `<tr><td colspan="6" class="admin-loading">${t("Carregando catálogo...")}</td></tr>`;
  const res = await MES.apiGet("/api/products");
  if(!res.ok){ MES.showToast(res.error || t("Erro ao carregar catálogo.")); return; }
  allProducts = res.products;
  applyFilters();
}

document.getElementById("searchInput").addEventListener("input", applyFilters);
document.getElementById("catFilter").addEventListener("change", applyFilters);

document.getElementById("productsTableBody").addEventListener("click", async (e) => {
  const saveBtn = e.target.closest(".save-product-btn");
  const deleteBtn = e.target.closest(".delete-product-btn");

  if(saveBtn){
    const id = saveBtn.dataset.id;
    const root = document.getElementById(`productDetailInner-${id}`);
    const errorBox = root.querySelector(`[data-edit-error="${id}"]`);
    errorBox.classList.remove("show");
    const payload = readProductForm(root);
    const res = await MES.apiPatch(`/api/admin/products/${encodeURIComponent(id)}`, payload);
    if(!res.ok){
      errorBox.textContent = res.error || t("Não foi possível salvar.");
      errorBox.classList.add("show");
      return;
    }
    MES.showToast(t("Produto atualizado."));
    loadProducts();
    return;
  }

  if(deleteBtn){
    const id = deleteBtn.dataset.id;
    const p = allProducts.find(x => x.id === id);
    if(!confirm(`${t("Excluir")} "${p ? p.name : id}" ${t('do catálogo? Essa ação não pode ser desfeita.')}`)) return;
    const res = await MES.apiDelete(`/api/admin/products/${encodeURIComponent(id)}`);
    if(!res.ok){ MES.showToast(res.error || t("Erro ao excluir.")); return; }
    MES.showToast(t("Produto excluído."));
    loadProducts();
    return;
  }

  if(e.target.closest("select") || e.target.closest("input") || e.target.closest("button")) return;
  const row = e.target.closest(".admin-order-row");
  if(!row) return;
  const id = row.dataset.id;
  const detail = document.querySelector(`.admin-order-detail[data-detail-for="${CSS.escape(id)}"] .admin-order-detail-inner`);
  if(!detail) return;
  const willOpen = !detail.classList.contains("open");
  detail.classList.toggle("open");
  if(willOpen && !detail.dataset.built){
    const p = allProducts.find(x => x.id === id);
    detail.innerHTML = productDetailHTML(p);
    wireProductForm(detail);
    detail.dataset.built = "1";
  }
});

/* ---------------------- INIT ---------------------- */
async function init(){
  const admin = await MES.requireAuth("energia_solar");
  if(!admin) return;
  document.getElementById("catFilter").insertAdjacentHTML("beforeend",
    Object.entries(CATEGORY_LABELS).map(([k,l]) => `<option value="${k}">${l}</option>`).join(""));
  await loadProducts();
}

document.getElementById("logoutBtn").addEventListener("click", () => MES.logout());

init();
</script>
</body>
</html>
