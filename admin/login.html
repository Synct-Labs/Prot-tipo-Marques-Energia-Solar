<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Login do Administrador | Marques Energia Solar</title>
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="admin.css">
<script src="../theme-toggle.js"></script>
<script src="../i18n-dict.js"></script>
<script src="../i18n.js"></script>
</head>
<body class="admin-body">

<div class="admin-login-wrap">
  <div class="admin-login-card">
    <div class="admin-login-logo">
      <img src="../logo-mark-128.png" alt="Marques Energia Solar">
      <h1>Painel de Administrador</h1>
      <p>Marques Energia Solar</p>
    </div>

    <div class="admin-error" id="loginError"></div>

    <form id="loginForm">
      <div class="admin-field">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" required autocomplete="username" placeholder="admin@marquesenergiasolar.com.br">
      </div>
      <div class="admin-field">
        <label for="password">Senha</label>
        <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••">
      </div>
      <button type="submit" class="admin-btn" id="loginBtn">Entrar</button>
    </form>

    <p class="admin-note">Acesso restrito à equipe da Marques Energia Solar.</p>
  </div>

  <!-- ---- PASSO 2FA: verificação em duas etapas, obrigatória pro admin ---- -->
  <div class="admin-login-card" id="twoFaCard" hidden>
    <div class="admin-login-logo">
      <img src="../logo-mark-128.png" alt="Marques Energia Solar">
      <h1>Verificação em duas etapas</h1>
      <p>Digite o código de 6 dígitos que mandamos pro seu e-mail.</p>
    </div>

    <div class="admin-error" id="twoFaError"></div>

    <form id="twoFaForm">
      <div class="admin-field">
        <label for="twoFaCode">Código</label>
        <input type="text" id="twoFaCode" name="code" required autocomplete="one-time-code" inputmode="numeric" placeholder="000000" maxlength="6">
      </div>
      <button type="submit" class="admin-btn" id="twoFaBtn">Confirmar</button>
      <button type="button" class="admin-btn admin-btn-ghost" id="twoFaBackBtn" style="margin-top:10px;">Voltar</button>
    </form>
  </div>
</div>

<script src="../api-config.js"></script>
<script src="admin.js"></script>
<script>
(async function(){
  // Se já existir sessão válida, pula direto para a área que o funcionário pode ver.
  const me = await MES.apiGet("/api/auth/me").catch(() => null);
  if(me && me.ok) window.location.href = MES.landingPageFor(me.admin);
})();

let pendingTwoFaToken = null;

document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const errorBox = document.getElementById("loginError");
  const btn = document.getElementById("loginBtn");
  errorBox.classList.remove("show");
  btn.disabled = true;
  btn.textContent = "Entrando...";

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  try {
    const res = await MES.apiPost("/api/auth/login", { email, password });
    if(!res.ok){
      errorBox.textContent = res.error || "Não foi possível entrar.";
      errorBox.classList.add("show");
      return;
    }
    pendingTwoFaToken = res.pendingToken;
    document.getElementById("loginForm").closest(".admin-login-card").hidden = true;
    document.getElementById("twoFaCard").hidden = false;
    document.getElementById("twoFaCode").focus();
  } catch(err){
    errorBox.textContent = "Erro de conexão com o servidor. Verifique se o backend está rodando.";
    errorBox.classList.add("show");
  } finally {
    btn.disabled = false;
    btn.textContent = "Entrar";
  }
});

document.getElementById("twoFaForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const errorBox = document.getElementById("twoFaError");
  const btn = document.getElementById("twoFaBtn");
  errorBox.classList.remove("show");
  btn.disabled = true;
  btn.textContent = "Confirmando...";

  const code = document.getElementById("twoFaCode").value.trim();

  try {
    const res = await MES.apiPost("/api/auth/login/2fa", { pendingToken: pendingTwoFaToken, code });
    if(!res.ok){
      if(res.pendingToken) pendingTwoFaToken = res.pendingToken;
      errorBox.textContent = res.error || "Não foi possível confirmar o código.";
      errorBox.classList.add("show");
      if(res.expired){
        document.getElementById("twoFaCard").hidden = true;
        document.getElementById("loginForm").closest(".admin-login-card").hidden = false;
      }
      return;
    }
    window.location.href = MES.landingPageFor(res.admin);
  } catch(err){
    errorBox.textContent = "Erro de conexão com o servidor. Tente novamente em instantes.";
    errorBox.classList.add("show");
  } finally {
    btn.disabled = false;
    btn.textContent = "Confirmar";
  }
});

document.getElementById("twoFaBackBtn").addEventListener("click", () => {
  pendingTwoFaToken = null;
  document.getElementById("twoFaCard").hidden = true;
  document.getElementById("loginForm").closest(".admin-login-card").hidden = false;
  document.getElementById("twoFaForm").reset();
});
</script>
</body>
</html>
